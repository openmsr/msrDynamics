# Place this file at the project root (one level above testCases/).
# pytest will auto-discover it and use it to configure every test run.

[pytest]
# Directory pytest collects tests from. Adjust the path if pytest.ini
# sits inside testCases/ instead of one level above it.
testpaths = testCases

# Add testCases/ to sys.path before collection so the test files in
# testCases/pke/ and testCases/th/ can resolve `from conftest import X`
# to the single combined conftest at testCases/conftest.py.
# Requires pytest >= 7.0.
pythonpath = testCases

# Registered markers. Unregistered markers raise PytestUnknownMarkWarning,
# which clutters output. Use as `pytest -m smoke`, `pytest -m "pke and delay"`,
# `pytest -m "delay and not compounded"`, etc.
markers =
    pke: PKE-domain tests (point-kinetics equations)
    th: thermal-hydraulics-domain tests
    delay: tests exercising delay machinery (set_dcdt flow=True or node.y(t-tau))
    smoke: API plumbing — quickest tests, no physics
    basic: minimal single-mechanism qualitative checks
    function: function-level closed-form comparisons and parameter sweeps
    compounded: multi-mechanism, multi-node configurations

# Strict markers: typo'd marker names raise instead of silently passing.
# Comment this out if you'd rather have warnings than errors.
addopts = --strict-markers
